<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>magic</title>

  <!-- Превью ссылки: крупный кадр с игрушкой Саши -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kilmanr.github.io/magic/">
  <meta property="og:title" content="magic">
  <meta property="og:image" content="https://kilmanr.github.io/magic/sasha-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://kilmanr.github.io/magic/sasha-preview.jpg">

  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; touch-action: manipulation; }
    #stage {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      transform: scale(1);
      transition: transform 160ms ease-out;
      will-change: transform;
    }
    #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <img id="stage" src="sasha.jpg" alt="">
  <canvas id="fx"></canvas>

  <script>
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');

    const SHRINK = [1, 0.75, 0.5, 0.25, 0];
    const GROW = [0, 0.25, 0.5, 0.75, 1];
    const STEP_MS = 220;
    const HOLD_MS = 700;
    const COLORS = ['#ff4d6d', '#ffd166', '#06d6a0', '#4cc9f0', '#f72585', '#fff'];

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    let running = false;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function burst() {
      const parts = Array.from({ length: 160 }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 9;
        return {
          x: innerWidth / 2,
          y: innerHeight / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          size: 4 + Math.random() * 7,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.3,
          life: 1
        };
      });

      let frame = 0;
      (function tick() {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        let alive = false;
        for (const p of parts) {
          if (p.life <= 0) continue;
          alive = true;
          p.vy += 0.22;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          p.life -= 0.012;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        }
        if (alive && frame++ < 180) requestAnimationFrame(tick);
        else ctx.clearRect(0, 0, innerWidth, innerHeight);
      })();
    }

    async function show(src) {
      stage.src = src;
      try { await stage.decode(); } catch (_) { /* картинка уже видна */ }
    }

    async function stepTo(value) {
      stage.style.transform = `scale(${value})`;
      await wait(STEP_MS);
    }

    async function run() {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        await show('oksana.jpg');
        return;
      }

      stage.style.transition = 'none';
      await show('sasha.jpg');
      stage.style.transform = 'scale(1)';
      await wait(50);
      stage.style.transition = '';

      await wait(HOLD_MS);
      for (const value of SHRINK.slice(1)) await stepTo(value);

      burst();
      await show('oksana.jpg');
      await wait(STEP_MS);
      for (const value of GROW.slice(1)) await stepTo(value);
    }

    addEventListener('resize', resizeCanvas);
    resizeCanvas();

    stage.addEventListener('click', async () => {
      if (running) return;
      running = true;
      await run();
      running = false;
    });

    (async () => {
      running = true;
      await run();
      running = false;
    })();
  </script>
</body>
</html>
